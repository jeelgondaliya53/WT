<html>
<head>
    <link rel="stylesheet" href="reg.css">
<section id="register.html">
    <script>
        function validateform(){
            let name=document.getElementById("name").value;
            let userid=document.getElementById("userid").value;
            let email=document.getElementById("email").value;
            let password=document.getElementById("password").value;

            if(name==""){
                alert("please enter your name");
                return false;
            }

             if(userid==""){
                alert("please enter your user id");
                return false;
            }

             if(email==""){
                alert("please enter your email");
                return false;
            }

             if(password=""){
                alert("please enter your password");
                return false;
            }

            if(password.length<=8)
            {
                alert("password must be greater than 8character");
                return false;
            }
            alert("Registration succesful")
            return false;
        }


    </script>
    <h2>register here!</h2>

    <form onsubmit=" return validateform()"></form>
    
    <body style="background-color: white;"
    <background image="blue"></background>
    
    <form onsubmit="return validateform();">
        <label>full Name: </label><br>
        <input type="text" placeholder="Enter your full name:" id="name" > <br>

        <label>User Id</label><br>
        <input type="text" placeholder="Enter your student user id:" id="userid"><br>

        <label>Email:</label><br>
        <input type="email" placeholder="Enter your email:" id="email"><br>

        <label>Password:</label><br>
        <input type="password" placeholder="Enter your password" id="password"><br>

        <label>Gender</label><br>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <input type="radio" name="gender"> other<br><br>

        <label>Department</label>
        <select>
            <option>Artificial intelligence and machine learnging</option>
            <option>Computer engineering</option>
            <option>Computer science & engineering</option>
            <option>Information technology</option>
            <option>Civil engineering</option>
        </select><br><br>

        <label>Address</label>
        <textarea rows="4" cols="50"></textarea><br><br>
        

        <input type="submit" value="submit">
        <input type="submit" value="Register">
        <input type="reset" value="Reset">

    </form>
</section>
</head>
</body>
</html>
