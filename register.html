<html>
<head>
    <link rel="stylesheet" href="reg.css"
<section id="register.html">
    <h2>register here!</h2>
    <p>
The registration page allows new students to create an account by providing
their personal and academic details. <br>After successful registration, students
can log in and use all StudentHub services.
</p>
    <body style="background-color: white;"
    <background image="blue"></background>
    
    <form action="about.html" method="get">
        <label>full Name:</label><br>
        <input type="text" placeholder="Enter your full name:"> <br>

        <label>User Id</label><br>
        <input type="text" placeholder="Enter your student user id:"><br>

        <label>Email:</label><br>
        <input type="email" placeholder="Enter your email:"><br>

        <label>Password:</label><br>
        <input type="password" placeholder="Enter your password"><br>

            <option>Artificial intelligence and machine learnging</option>
            <option>Computer engineering</option>
            <option>Computer science & engineering</option>
            <option>Information technology</option>
            <option>Civil engineering</option>
        </select><br><br>

        <label>Address</label>
        <textarea rows="4" cols="50"></textarea><br><br>
        

        <input type="submit" value="submit">
        <input type="submit" value="Register">
        <input type="reset" value="Reset">
    </form>
</section>
</head>
